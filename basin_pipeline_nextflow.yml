paths:
  output_dir: /abs/path/biochem_output
  work_dir: /abs/path/biochem_output/nf_work
  conda_cache_dir: /abs/path/biochem_output/conda_cache

resources:
  threads: 12

biochem:
  enabled: true
  table_a: /abs/path/SI_JA_Compiled_Geochem_Dec_09_Outlier_RM.csv
  table_b: /abs/path/SI_JA_Compiled_CTD_Data_Dec_18_2025_Outlier_RM.csv
  output_root:
  cleaned_density_filename: 02_oxygen_best_available_density_RJM.tsv
  clean_keep_cols:
    - cruise_year_month_depth
    - Cruise
    - Year
    - Month
    - Day
    - Depth
    - Phosphate
    - Silicate
    - Nitrite
    - Nitrate
    - Ammonium
    - Hydrogen Sulfide
    - Nitrous Oxide
    - Methane
    - Temperature
    - Salinity
    - Oxygen
    - Density
    - Fe
    - Dimethyl Sulfide
  clean_drop_cols: []
  clean_rename_map:
    PO4: Phosphate
    SI: Silicate
    NO2: Nitrite
    NO3: Nitrate
    NH4: Ammonium
    H2S: Hydrogen Sulfide
    N2O: Nitrous Oxide
    CH4: Methane
    Oxygen_best_available: Oxygen
    density_kg_m3: Density
  feature_cols: Oxygen,Nitrate,Nitrite,Nitrous Oxide,Ammonium,Hydrogen Sulfide,Methane,Phosphate,Silicate,Temperature,Salinity,Density,Fe,Dimethyl Sulfide
  gmm_k: auto
  eof_pcs: 1,2,4

environments:
  biochem: processes/shared_envs/biochem.yml
  biochem_merge: processes/shared_envs/biochem.yml
  biochem_density: processes/shared_envs/biochem.yml
  biochem_strat_metrics: processes/shared_envs/biochem.yml
  biochem_custom_clean: processes/shared_envs/biochem.yml
  biochem_eigenvectors: processes/shared_envs/biochem.yml
  biochem_selectk: processes/shared_envs/biochem.yml
  biochem_gmm: processes/shared_envs/biochem.yml
  biochem_o2_soft: processes/shared_envs/biochem.yml
  biochem_hybrid: processes/shared_envs/biochem.yml
  biochem_compare: processes/shared_envs/biochem.yml
  biochem_split_o2_by_gmm: processes/shared_envs/biochem.yml
  biochem_strat_anomaly: processes/shared_envs/biochem.yml
  biochem_state_transitions: processes/shared_envs/biochem.yml
  biochem_succession: processes/shared_envs/biochem.yml
  biochem_feature_assoc: processes/shared_envs/biochem.yml
  biochem_eof_pipeline: processes/shared_envs/biochem.yml
  biochem_eof_state_cluster: processes/shared_envs/biochem.yml
  biochem_eof_mode_plots: processes/shared_envs/biochem.yml
  biochem_within_gmm: processes/shared_envs/biochem.yml
